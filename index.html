<style>
:root { --ink: #4a3b35; --soft: #7a655b; --pink: #ff8fab; --card: #fffdf8; --gold: #ffb400 }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; overflow: hidden; background: #cdeaa8; color: var(--ink); font-family: "Jua", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
#pause { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-size: 13px; box-shadow: 0 3px 0 var(--ink); cursor: pointer }
#snd { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(64px + env(safe-area-inset-right)); z-index: 5; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font-size: 18px; line-height: 1; box-shadow: 0 3px 0 var(--ink); cursor: pointer; padding: 0 }   /* 소리 크기 창 열기 */
#sndm { position: fixed; inset: 0; z-index: 7; display: flex; padding: 16px; background: rgba(74, 59, 53, .35) }   /* 소리 크기 창 */
#sndm[hidden] { display: none }
.panel.snd { width: min(360px, 100%) }
.panel.snd label { display: grid; grid-template-columns: 84px 1fr 34px; align-items: center; gap: 10px; margin: 12px 0; font-size: 17px; text-align: left }
.panel.snd input { width: 100%; accent-color: var(--pink) }
.panel.snd b { text-align: right; font-weight: normal; font-family: system-ui, sans-serif; font-size: 14px }
#pause[hidden] { display: none }
#ui { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); overflow-y: auto; background: rgba(74, 59, 53, .28) }
#ui[hidden] { display: none }
.panel { margin: auto; width: min(640px, 100%); background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 20px 18px; box-shadow: 0 6px 0 rgba(74, 59, 53, .45); text-align: center; animation: pop .22s ease-out }
@keyframes pop { from { transform: scale(.94); opacity: 0 } }
.h { margin: 0 0 12px; font-size: 26px }
.sub { margin: 4px 0 14px; color: var(--soft) }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px }
.btn { font: inherit; font-size: 18px; padding: 11px 20px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--ink) }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink) }
.btn:disabled { opacity: .4; cursor: default }
.btn.main { background: var(--pink); color: #fff; text-shadow: 0 1px 0 rgba(74, 59, 53, .5) }
kbd { font: 12px system-ui, sans-serif; opacity: .5; margin-left: 4px }
@media (hover: none) { kbd { display: none } }
canvas.pt { height: 72px; width: auto; image-rendering: auto }

/* 처음 화면 */
.trio { display: grid; grid-template-columns: repeat(4, auto); justify-content: center; justify-items: center; align-items: end; gap: 4px 10px }
.trio canvas.pt { height: 76px }
@media (max-width: 520px) { .trio canvas.pt { height: 54px } }
.logo { margin: 6px 0 0; font-size: clamp(40px, 11vw, 60px); line-height: 1.05; color: #fff; font-weight: normal; text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0 7px 0 var(--ink) }
.logo span { display: block; color: var(--pink); font-size: .6em }
.rec { margin: 14px 0 0; color: var(--soft); font-size: 15px; line-height: 1.5 }
.fine { margin: 14px 0 0; font-size: 12px; color: #a89488; font-family: system-ui, sans-serif }
.fine a { color: inherit }
.fine a.kofi { display: inline-block; padding: 1px 9px; border: 1.5px solid currentColor; border-radius: 999px; text-decoration: none }   /* 작은 후원 단추 — Ko-fi */
.fine + .fine { margin-top: 4px }

/* 캐릭터 고르기 */
.panel.wide { width: min(900px, 100%) }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.char { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; box-shadow: 0 4px 0 var(--ink) }
.char.on { background: #fff0f4; border-color: var(--pink); box-shadow: 0 4px 0 var(--pink) }
.char b { font-size: 21px }
.char small { font-size: 14px; color: #c07a2c }
.char .trait { font-size: 15px; color: var(--pink) }
.char .note, .char .best { font-size: 13px; color: var(--soft); font-family: system-ui, sans-serif; line-height: 1.4 }
.diff { display: flex; gap: 8px; justify-content: center; margin-top: 14px }
.diff button { font: inherit; font-size: 17px; padding: 6px 16px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer }
.diff button.on { background: var(--pink); border-color: var(--pink); color: #fff }
.diff-note { margin: 6px 0 0; text-align: center; font-size: 13px; color: var(--soft); font-family: system-ui, sans-serif }
@media (max-width: 520px) {
  .chars { grid-template-columns: 1fr }
  .char { display: grid; grid-template-columns: 76px 1fr; text-align: left; align-items: center; column-gap: 12px }
  .char canvas.pt { grid-row: span 5; justify-self: center }
}

/* 레벨 업 상자 */
.box-title { margin: 0; font-size: 28px; color: #fff; text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 4px 0 var(--ink) }
.jack { margin: 4px 0 0; font-size: 34px; color: var(--gold); text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink); animation: shake .4s infinite alternate }
@keyframes shake { from { transform: rotate(-3deg) scale(1) } to { transform: rotate(3deg) scale(1.08) } }
.box.jackpot { background: linear-gradient(#fff3c4, var(--card) 60%) }
.cards { display: grid; gap: 10px; margin: 14px 0 10px }
.card { position: relative; display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 2px 12px; text-align: left; padding: 12px 14px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; box-shadow: 0 4px 0 var(--ink); animation: pop .25s ease-out backwards; animation-delay: calc(var(--i) * 60ms) }
.card.w { background: #fff6e6 }
.card.p { background: #eef5ff }
.card .ic { grid-row: span 3; font-size: 40px; text-align: center; line-height: 1 }
.card small { color: #b07a4f; font-size: 14px }
.card b { font-size: 20px }
.card .note { font-size: 14px; color: var(--soft); font-family: system-ui, sans-serif; line-height: 1.4 }
.card.synergy { border-color: #e8a400; box-shadow: 0 4px 0 #e8a400, 0 0 0 4px rgba(255, 200, 60, .35) }
.card .syn { grid-column: 1 / -1; margin-top: 6px; padding: 5px 9px; border-radius: 10px; background: #fff0c4; font-size: 13px; line-height: 1.4 }
.card .syn mark { background: #e8a400; color: #fff; border-radius: 6px; padding: 0 6px }
.card kbd { position: absolute; top: 6px; right: 10px }
.box:not(.ready) .card { pointer-events: none }
.box.banning .card { border-color: #ff5b5b; box-shadow: 0 4px 0 #ff5b5b }
.box.jackpot .card { cursor: default }
.hint { margin: 4px 0 0; color: var(--soft); font-size: 15px }
.btn.act { font-size: 16px; padding: 8px 14px }
.btn.act em { font-style: normal; background: var(--ink); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: 13px }
.btn.act.on { background: #ffd9d9 }
@media (min-width: 760px) {
  .panel.box { width: min(860px, 100%) }
  .cards { grid-template-columns: repeat(3, 1fr) }
  .card { grid-template-columns: 1fr; text-align: center; align-content: start; padding-top: 16px }
  .card .ic { grid-row: auto; font-size: 48px }
}

/* 일시정지 · 결과 */
.build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 }
.chip { padding: 4px 10px; border-radius: 999px; background: #eef5ff; border: 2px solid var(--ink); font-size: 14px }
.chip.w { background: #fff1d6 }
button.chip { font: inherit; color: inherit; cursor: pointer }
button.chip:hover, button.chip.on { box-shadow: 0 0 0 3px var(--pink) }
.skill-detail { text-align: left; background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; font: 14px/1.45 system-ui, sans-serif; color: var(--ink) }
.skill-detail p { margin: 4px 0 }
.skill-detail .t { font: 18px Jua, sans-serif }
.skill-detail .t small { color: var(--soft); font-size: 14px }
.skill-detail .hint { color: var(--soft); text-align: center }
.skill-detail .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 4px 8px; margin: 6px 0 }
.skill-detail .kv div { background: #fdf6e8; border-radius: 8px; padding: 3px 8px }
.skill-detail .kv.wide { grid-template-columns: 1fr }
.skill-detail .kv small { display: block; color: var(--soft); font-size: 11px }
.skill-detail .next { color: #2f7a3a }
.skill-detail .syn { color: var(--soft) } .skill-detail .syn.on { color: #c77800; font-weight: 600 }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 }
.stats div { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 4px }
.stats small { display: block; color: var(--soft); font-size: 13px }
.stats b { font-size: 20px }
.stats .new { color: #ff5b7f; font-size: 12px; margin-left: 2px }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr) } }
.result.win { background: linear-gradient(#fff3c4, var(--card) 50%) }

.guide > .row:last-child { position: sticky; bottom: -20px; z-index: 2; margin: 8px -18px -20px; padding: 18px 18px 16px; background: linear-gradient(rgba(255, 253, 246, 0), var(--card) 40%); border-radius: 0 0 21px 21px }   /* 도감 — 「처음으로」는 늘 아래에 보이게 */

/* 도감 */
.guide { text-align: left }
.guide .h { text-align: center }
.guide h3 { margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 2px dashed #e5d6c8; font-size: 19px; font-weight: normal }
.guide p, .guide .rules { font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; color: var(--soft); margin: 0 }
.guide .rules { padding-left: 20px }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.list li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; background: #fff; border: 2px solid #eadccd; border-radius: 14px; padding: 8px 10px }
.list li > i { font-style: normal; font-size: 30px; text-align: center }
.list li canvas.pt { height: 52px; justify-self: center; max-width: 56px; object-fit: contain }
.list b { display: block; font-size: 16px; font-weight: normal }
.list span, .list em { display: block; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: var(--soft); font-style: normal }
.list em { color: #c07a2c }
</style>
</head>
<body>
<noscript><div class="panel" style="margin:40px auto"><h1>먼작귀 서바이버즈</h1><p>치이카와 비공식 팬게임 — 몰려오는 토벌 대상을 피해 버티고 25분 뒤 나타나는 최종보스 세이렌을 쓰러뜨리는 무료 브라우저 생존 게임이에요. 플레이하려면 자바스크립트를 켜 주세요.</p></div></noscript>
<canvas id="cv" aria-label="먼작귀 서바이버즈 게임 화면"></canvas>
<button type="button" id="pause" aria-label="일시정지" hidden>❚❚</button>
<button type="button" id="snd" aria-label="소리 크기">🔊</button>
<div id="ui"><div class="panel"><p class="h">불러오는 중…</p></div></div>
<script type="module" src="game.js"></script>
