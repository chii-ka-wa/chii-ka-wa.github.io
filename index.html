    .busy { position: fixed; inset: 0; z-index: 9; display: flex; padding: 16px; background: rgba(74, 59, 53, .35) } .busy .panel { width: min(320px, 100%) }   /* 로그인 중 — 세 친구가 오른쪽으로 걸으며 차례로 통통, 발밑 점선 길이 왼쪽으로 흐른다 */
    .busy .friends { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin-top: 4px } .busy .friends canvas { height: 54px; width: auto; animation: hop .9s ease-in-out infinite }

    @media (prefers-reduced-motion: reduce) { .busy .friends canvas, .busy .road { animation: none } }   /* 걷기 · 점 깜빡임만 남긴다 */
    .panel.ban { width: min(420px, 100%); padding-top: 48px } .panel.ban .until { margin: 12px 0; font-size: 17px }   /* IP 차단 안내 — 좁게, 풀리는 때는 굵게 */   /* 개인정보 처리방침 */
