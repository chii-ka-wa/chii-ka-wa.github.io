.rank .lvpill { display: inline-block; font-family: inherit; font-size: 14px; line-height: 1.4; color: #fff; white-space: nowrap } .rank .lvpill .long { display: none } .rank .lvpill > span { display: inline; font: inherit; color: inherit }
.rank .lvpill.zero, .lvl-badge.inf.zero { background: #efe6dc; color: var(--soft) } .lvl-badge.inf.zero { background: #b9a99b; color: #fff }
.rank .sc { display: grid; grid-template-columns: auto auto; justify-items: end; gap: 2px 8px } .rank .sc .lvpill { grid-column: 1 / -1 }
.rank .sc .t, .rank .sc .bs { display: block; font-family: inherit; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap }
.panel.rank .mine li { border-color: var(--pink) } .panel.rank .mine[data-t]::before { content: attr(data-t); display: block; text-align: left; font-size: 13px; color: var(--pink); margin: 0 0 2px 4px }   /* 내 기록 — 분홍 테두리(아래 border 보다 뒤에) · 꼬리표 */
.rank .sc .bs i { font-style: normal }
@media (max-width: 420px) { .rank .wp .ico { width: 16px; height: 16px } .rank .wp { gap: 1px; overflow: hidden; flex-wrap: wrap; height: 16px } }   /* 스킬 6개가 시간 글자에 닿지 않게 — 넘치는 건 다음 줄(가려짐)로 */
/* 플레이한 언어 국기 — 그림 오른쪽 아래 배지(닉네임 칸을 안 먹는다 · 디자인), 흰 그림자 두 겹이 테두리. .ico 의 pointer-events: none 을 풀어 PC 에선 이름이 뜬다 */
.rank .av { position: relative; justify-self: center; line-height: 0 }
.rank .av > .flag { position: absolute; right: -4px; bottom: -2px; width: 16px; height: 16px; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff); pointer-events: auto }
.panel.rinfo .flag.in { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; pointer-events: auto }
@media (max-width: 400px) {   /* 휴대폰(360px) — 두 줄: 닉네임 · 스킬 / 시간 · 보스, 알약은 오른쪽 위(디자인) */
  .list.rank li:not(.ghost), .panel.rank .mine li:not(.ghost) { grid-template-columns: 28px 36px minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 0 6px; padding: 6px 8px }
  .rank li > .rk { grid-area: 1 / 1 / 3 / 2 } .rank li > .av { grid-area: 1 / 2 / 3 / 3 } .rank li > div:not(.sc) { grid-area: 1 / 3 / 2 / 4 }
  .list.rank .av canvas.pt, .panel.rank .mine .av canvas.pt { height: 36px; max-width: 36px }
  .rank .sc { display: contents } .rank .sc .lvpill { grid-area: 1 / 4 / 2 / 5; justify-self: end; align-self: start; font-size: 12px }
  .rank .sc .t { grid-area: 2 / 3 / 3 / 4; justify-self: start } .rank .sc .bs { grid-area: 2 / 4 / 3 / 5; justify-self: end }
  .list.rank b, .panel.rank .mine b { font-size: 15px } .rank .av > .flag { width: 14px; height: 14px }
}
.list.rank li.head { display: none } .panel.rank li.ghost { grid-template-columns: minmax(0, 1fr) auto; border: 2px dashed var(--pink); background: #fff8fa; cursor: default }
.rank li.ghost > span:first-child { font-family: inherit; font-size: 14px; color: var(--soft) } .rank li.ghost .btn { margin: 0; font-size: 15px; padding: 5px 14px }
.panel.rank .dex-nav { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent) }
@media (min-width: 640px) {
  .panel.rank.wide { width: min(720px, 100%) }
  .panel.rank .dex-nav { display: grid; grid-template-columns: repeat(5, 1fr); overflow: visible; -webkit-mask-image: none; mask-image: none } .panel.rank .dex-nav button { display: flex; align-items: center; justify-content: center; gap: 4px }   /* 탭 10개 — 5칸 두 줄 */
  .panel.rank .dex-nav button { min-width: 0; padding-inline: 6px; overflow: hidden }   /* 좁은 칸에 긴 이름(일본어 モモンガ · くりまんじゅう) — 테두리에 닿지 않게 */
  .list.rank li:not(.ghost), .panel.rank .mine li:not(.ghost) { grid-template-columns: 30px 48px minmax(0, 1fr) 96px 64px 56px }
  .rank .sc { display: contents } .rank .sc .t, .rank .sc .bs { font-size: 15px; color: var(--ink); justify-self: end } .rank .sc .bs i { display: none } .rank .sc .lvpill { grid-column: auto; justify-self: center } .rank .lvpill .long { display: inline } .rank .lvpill .short { display: none }
  .list.rank li.head { display: grid; padding-top: 0; padding-bottom: 0; border: 0; background: none; cursor: default } .list.rank li.head span { font-family: inherit; font-size: 12px; color: var(--soft) }
  .list.rank li.head span:nth-child(4) { justify-self: center } .list.rank li.head span:nth-child(n+5) { justify-self: end }
}
@media (min-width: 640px) { .panel.rank .dex-nav button { font-size: 12.5px; gap: 2px; padding-inline: 4px } .panel.rank .dex-nav .ico { width: 18px; height: 18px } }   /* 탭 칸(패널 720 · 5칸) — 글자 조금 작게(넓은 화면도 패널이 720 이라 칸 폭이 같다) */
@media (min-width: 640px) and (max-width: 719px) { .panel.rank .dex-nav button { font-size: 11.5px; padding-inline: 2px } .panel.rank .dex-nav .ico { width: 15px; height: 15px } }
.panel.rank .sub { text-wrap: balance }   /* 「풀밭 · 전체 TOP 100 · / 한 사람당 최고 기록 하나」 — 마지막 낱말만 혼자 남지 않게 */
.panel.rinfo canvas.pt { height: 72px } .panel.rinfo .sub { margin-bottom: 4px }
.panel.rinfo .brow { display: grid; grid-template-columns: 64px 1fr; align-items: start; text-align: left; gap: 6px } .panel.rinfo .brow > small { color: var(--soft); font-size: 13px; padding-top: 7px } .panel.rinfo .brow + .brow { margin-top: 8px }   /* 이름표는 묶음 첫 줄에 · 묶음 사이 띄우기(디자인) */
.panel.rinfo .build { justify-content: flex-start; margin: 4px 0 } .panel.rinfo .chip .ico { width: 18px; height: 18px; vertical-align: -4px }
.panel.snd { width: min(360px, 100%) }
.panel.snd label { display: grid; grid-template-columns: 84px 1fr 34px; align-items: center; gap: 10px; margin: 12px 0; font-size: 17px; text-align: left }
.panel.snd input { width: 100%; accent-color: var(--pink) }
.panel.snd b { text-align: right; font-weight: normal; font-family: system-ui, sans-serif, var(--cjk, sans-serif); font-size: 14px }
#pause[hidden] { display: none }
#ui { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); overflow-y: auto; background: rgba(74, 59, 53, .28) }
#ui[hidden] { display: none }
@media (max-width: 1120px) { #ui { padding-top: calc(max(16px, env(safe-area-inset-top)) + 56px) } }   /* 창이 좁으면 오른쪽 위 소리 단추 자리를 비워 둔다(창 제목과 겹치지 않게) */
@media (max-width: 1120px) and (max-height: 500px) { #ui { padding-top: max(16px, env(safe-area-inset-top)); padding-right: calc(max(16px, env(safe-area-inset-right)) + 104px) } }   /* 가로로 눕힌 휴대폰 — 높이가 모자라니 위 대신 오른쪽을 비운다 */
.panel { margin: auto; width: min(640px, 100%); background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 20px 18px; box-shadow: 0 6px 0 rgba(74, 59, 53, .45); text-align: center; animation: pop .22s ease-out }
@keyframes pop { from { transform: scale(.94); opacity: 0 } }
/* PC 첫 판 조작법(디자인 2026-11-18) — 아래 가운데 반투명 카드 4칸 · 눌리지 않는다 · 남은 시간 막대. 위치 · 투명도 · 막대는 game.js 가(--y · opacity · --p) */
#ctrl { position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 3; transform: translateY(var(--y, 12px)); opacity: 0; pointer-events: none; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(150px, auto)); max-width: min(800px, calc(100vw - 32px)); padding: 12px 0 14px; background: rgba(255, 250, 240, .92); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 rgba(74, 59, 53, .35); overflow: hidden; color: var(--ink) }
#ctrl.off { visibility: hidden } #ctrl.off * { animation-play-state: paused }
#ctrl .cc { display: grid; justify-items: center; align-content: start; gap: 8px; padding: 0 14px; text-align: center } #ctrl .cc + .cc { border-left: 2px dashed #e5d6c8 }
#ctrl p { margin: 0; font-size: 15px; line-height: 1.35 }
#ctrl .pic { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; height: 68px }
#ctrl .tee { display: grid; grid-template-columns: repeat(3, auto); gap: 4px } #ctrl .k1 { grid-area: 1 / 2 } #ctrl .k2 { grid-area: 2 / 1 } #ctrl .k3 { grid-area: 2 / 2 } #ctrl .k4 { grid-area: 2 / 3 }
#ctrl .kc { display: inline-grid; place-items: center; box-sizing: border-box; min-width: 30px; height: 30px; padding: 0 6px; border: 2.5px solid var(--ink); border-radius: 8px; background: #fff; box-shadow: 0 3px 0 var(--ink); font-size: 15px; line-height: 25px }
#ctrl .tri, #ctrl .tri svg { display: block }
#ctrl .tee .kc { animation: kpress 1.6s infinite } #ctrl .tee .k2 { animation-delay: .4s } #ctrl .tee .k3 { animation-delay: .8s } #ctrl .tee .k4 { animation-delay: 1.2s }   /* ↑+W → ←+A → ↓+S → →+D */
#ctrl .esc { min-width: 44px; animation: kpress2 4.8s infinite } #ctrl .pk { animation: kpress2 4.8s 2.4s infinite } #ctrl .sl { margin: 0 -8px; color: var(--soft) }   /* Esc · P 번갈아 */
@keyframes kpress { 0%, 24% { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); background: var(--pink); color: #fff } 25%, 100% { transform: none; box-shadow: 0 3px 0 var(--ink); background: #fff; color: var(--ink) } }
@keyframes kpress2 { 0%, 8% { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); background: var(--pink); color: #fff } 9%, 100% { transform: none; box-shadow: 0 3px 0 var(--ink); background: #fff; color: var(--ink) } }
#ctrl .mw { position: relative; display: block; width: 34px; height: 50px; align-self: flex-end }   /* 아래에 — 위로 끌려 올라가도 카드에 안 잘리게 */
#ctrl .ms { position: absolute; inset: 0; box-sizing: border-box; border: 2.5px solid var(--ink); border-radius: 17px 17px 20px 20px; background: #fff; overflow: hidden; animation: mdrag 2.4s infinite }
#ctrl .ms::after { content: ''; position: absolute; left: calc(50% - 1px); top: 0; height: 40%; border-left: 2px solid var(--ink) } #ctrl .ms .lb { position: absolute; left: 0; top: 0; width: 50%; height: 40%; animation: lbtn 2.4s infinite }
#ctrl .trail { position: absolute; left: 28px; top: -22px; color: var(--pink); opacity: 0; animation: trail 2.4s infinite } #ctrl .trail svg { display: block }
@keyframes mdrag { 0%, 12.5% { transform: none } 66.7% { transform: translate(25px, -25px) } 100% { transform: none } }   /* 2.4초 — 누르기 0.3 · 끌기 1.3 · 놓고 돌아오기 0.8 */
@keyframes lbtn { 0%, 66.6% { background: var(--pink) } 66.7%, 100% { background: transparent } }
@keyframes trail { 0%, 12.5% { opacity: 0 } 66.7% { opacity: 1 } 100% { opacity: 0 } }
#ctrl .auto { position: relative; display: grid; place-items: center; width: 56px; height: 56px }
#ctrl .auto .ico { width: 32px; height: 32px; animation: hop2 1.2s infinite } #ctrl .ring { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px; box-sizing: border-box; border: 2.5px solid var(--pink); border-radius: 50%; animation: ring 1.2s infinite }
#ctrl .spark { position: absolute; right: 6px; top: 4px; width: 6px; height: 6px; background: #ffd23f; border: 1.5px solid var(--ink); transform: rotate(45deg) scale(0); animation: spark 1.2s infinite }
@keyframes ring { from { transform: scale(.6); opacity: 1 } to { transform: scale(1.6); opacity: 0 } } @keyframes hop2 { 0%, 100% { transform: none } 6% { transform: translateY(-3px) } 12.5% { transform: none } } @keyframes spark { 0%, 60%, 100% { transform: rotate(45deg) scale(0) } 30% { transform: rotate(45deg) scale(1) } }
#ctrl .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--pink); transform-origin: left; transform: scaleX(var(--p, 1)) }
#ctrl .zm { display: block; margin-top: 3px; font: 12px/1.35 system-ui, sans-serif, var(--cjk, sans-serif); color: var(--soft) } #ctrl .zm .ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px }   /* 작은 글 — 화면 배율(.fine 처럼 또렷한 글꼴) */
/* 휴대폰 · 태블릿 — 세로: 위쪽(HUD 140px 밑 · 엄지에 안 가리게) 3줄 목록, 카드 아래 끝이 캐릭터보다 위 / 가로 휴대폰: 아래 3칸(디자인) */
#ctrl.touch { top: calc(env(safe-area-inset-top) + 146px); bottom: auto; background: rgba(255, 250, 240, .97); width: min(420px, calc(100vw - 24px)); max-width: none; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 12px 12px }
#ctrl.touch .cc { grid-template-columns: 44px minmax(0, 1fr); gap: 6px 10px; align-items: center; justify-items: start; text-align: left; padding: 0 } #ctrl.touch .cc + .cc { border-left: 0 }
#ctrl.touch .pic { width: 44px; height: 36px; gap: 0 } #ctrl.touch p { font-size: 14px; line-height: 1.35 }
#ctrl.touch .auto { width: 36px; height: 36px } #ctrl.touch .auto .ico { width: 28px; height: 28px } #ctrl.touch .ring { width: 30px; height: 30px } #ctrl.touch .spark { right: 0; top: 0 }
#ctrl .pzi svg { width: 14px; height: 14px; vertical-align: -2px; margin: 0 2px }
@media (max-height: 700px) { #ctrl.touch { top: calc(env(safe-area-inset-top) + 124px) } #ctrl.touch .cc { min-height: 30px } #ctrl.touch .pic { height: 28px; scale: .7 } #ctrl.touch p { font-size: 13px } }
@media (max-height: 600px) { #ctrl.touch { gap: 2px; padding: 8px 10px 10px } #ctrl.touch .cc { min-height: 26px } #ctrl.touch p { font-size: 12px; line-height: 1.3 } #ctrl.touch .zm { display: none } }   /* 멈춤 화면에 배율 슬라이더가 늘 보인다 · 카드 아래 끝이 캐릭터 머리 위로 */
@media (max-width: 1120px) and (max-height: 500px) {
  #ctrl.touch { top: auto; bottom: calc(10px + env(safe-area-inset-bottom)); width: min(600px, calc(100vw - 24px)); grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 }
  #ctrl.touch .cc { grid-template-columns: none; justify-items: center; text-align: center; gap: 4px; padding: 0 10px; min-height: 0 } #ctrl.touch .cc + .cc { border-left: 2px dashed #e5d6c8 }
  #ctrl.touch .pic { width: auto; height: 28px; scale: .78 } #ctrl.touch p { font-size: 12px }
}
#ctrl .fw { position: relative; display: block; width: 36px; height: 36px; box-sizing: border-box; border: 2.5px solid var(--ink); border-radius: 50%; background: rgba(255, 255, 255, .6); animation: fwb 2.4s infinite }   /* 스틱 받침 — 누른 자리에 톡 생겼다 흐려진다 */
#ctrl .fw .tip { position: absolute; left: 7.5px; top: 7.5px; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid var(--ink); border-radius: 50%; background: var(--pink); animation: tdrag 2.4s infinite }
#ctrl .fw .tip::after { content: ''; position: absolute; left: 4px; top: 4px; width: 14px; height: 20px; box-sizing: border-box; border: 2px solid var(--ink); border-radius: 7px 7px 6px 6px; background: #fff; transform: rotate(-15deg) }   /* 손가락 끝 */
@keyframes fwb { 0% { transform: scale(.6); opacity: 1 } 12.5% { transform: scale(1); opacity: 1 } 66.7% { transform: scale(1); opacity: 1 } 100% { transform: scale(1); opacity: 0 } }
@keyframes tdrag { 0%, 12.5% { transform: none } 39.6% { transform: translate(10px, -10px) } 66.7%, 100% { transform: none } }
#ctrl .pz { display: grid; place-items: center; width: 32px; height: 32px; box-sizing: border-box; border: 2.5px solid var(--ink); border-radius: 50%; background: #fff; box-shadow: 0 2px 0 var(--ink); color: var(--ink); animation: pzp 2.4s infinite } #ctrl .pz svg { width: 14px; height: 14px; display: block }
@keyframes pzp { 0%, 10% { transform: translateY(2px); box-shadow: none } 11%, 100% { transform: none; box-shadow: 0 2px 0 var(--ink) } }
@media (prefers-reduced-motion: reduce) { #ctrl * { animation: none !important } #ctrl .ms .lb { background: var(--pink) } #ctrl .trail { opacity: 1 } #ctrl .ring { transform: scale(1.2); opacity: .6 } #ctrl .spark { transform: rotate(45deg) } #ctrl .fw .tip { transform: translate(10px, -10px) } }   /* 멈춘 그림 */
.panel.again { animation: none }   /* 같은 화면을 다시 그릴 때 */
.h { margin: 0 0 12px; font-size: 26px }
.zoom { display: grid; grid-template-columns: auto 1fr 46px; align-items: center; gap: 10px; max-width: 360px; margin: 0 auto 12px; font-size: 16px }   /* 일시정지 — 화면 배율 */
.zoom input { width: 100%; accent-color: var(--pink) }
.zoom b { text-align: right; font-weight: normal; font-family: system-ui, sans-serif, var(--cjk, sans-serif); font-size: 14px }
.h .pill { display: inline-block; margin-left: 10px; padding: 2px 12px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 16px; vertical-align: middle }   /* 일시정지 옆 지금 난이도 */
.sub { margin: 4px 0 14px; color: var(--soft) }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px }
.btn { font: inherit; font-size: 18px; padding: 11px 20px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--ink) }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink) }
.btn:disabled { opacity: .4; cursor: default }
.btn.main { background: var(--pink); color: #fff; text-shadow: 0 1px 0 rgba(74, 59, 53, .5) }
kbd { font: 12px system-ui, sans-serif; opacity: .5; margin-left: 4px }
@media (hover: none) { kbd { display: none } }
canvas.pt { height: 72px; width: auto; image-rendering: auto }

/* 처음 화면 */
.trio { display: grid; grid-template-columns: repeat(4, auto); justify-content: center; justify-items: center; align-items: end; gap: 4px 10px }
.trio canvas.pt { height: 76px }
@media (max-width: 520px) { .trio canvas.pt { height: 54px } }
.panel.home { position: relative }
.panel.home p.hint { margin: 6px 0 0; color: #e8475f; font-size: 14px }   /* 저장 기록을 되돌렸다는 안내 */
.panel.home .trio { margin-top: 34px }   /* 테마 · 언어 단추(위 양쪽 구석) 아래로 캐릭터를 내린다 — 의상 날개 · 화관이 가려지지 않게 */
:root:lang(ja) { --cjk: "Zen Maru Gothic" } :root:lang(zh-CN) { --cjk: "Noto Sans SC" } :root:lang(zh-TW) { --cjk: "Noto Sans TC" }   /* 일본 · 중국 글자 — game.js 가 그 말일 때만 글꼴을 불러온다 */
.theme { position: absolute; top: 12px; left: 12px; z-index: 2; display: flex; font-size: 15px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; box-shadow: 0 2px 0 var(--ink); overflow: hidden }   /* 테마 고르기 — 처음 화면 왼쪽 위 */
.theme button { font: inherit; padding: 4px 10px 4px 7px; border: 0; background: none; color: var(--ink); cursor: pointer; white-space: nowrap }
.theme button.on { background: #ffe3ea }
.lang { position: absolute; top: 12px; right: 12px; z-index: 2; text-align: left; font-size: 15px }   /* 언어 고르기 — 처음 화면 오른쪽 위 */
.lang summary { list-style: none; cursor: pointer; padding: 4px 12px 4px 8px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; box-shadow: 0 2px 0 var(--ink); white-space: nowrap }
.lang summary::-webkit-details-marker { display: none }
.lang summary::after { content: ' \25BE'; color: var(--soft) }
.lang div { position: absolute; right: 0; margin-top: 6px; display: grid; gap: 2px; padding: 6px; border: 2px solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--ink) }

.cmp li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; background: #fff; border: 2px solid #eadfd4; border-radius: 14px }
.cmp canvas.pt { height: 32px; max-width: 36px; object-fit: contain } .cmp .ws { display: flex; gap: 2px; flex-wrap: nowrap; overflow: hidden } .cmp .ws .ico { width: 18px; height: 18px; flex: none }
.cmp .sc { text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.25 } .cmp .sc small { display: block; font-size: 12px; color: var(--soft) }
.cmp li.now { border-color: var(--pink); background: #fff0f4 } .cmp li.old { opacity: .45 } .cmp li.old .sc small::after { content: ' · ' attr(data-old) }
.panel.sim .row.two, .panel.simplan .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px } .panel.sim .row .btn, .panel.simplan .row .btn { white-space: normal; text-wrap: balance; line-height: 1.15 }
@media (prefers-reduced-motion: reduce) { .sim-hop canvas.pt, .spec-pick.new { animation: none } }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.char { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; box-shadow: 0 4px 0 var(--ink) }
.char.on { background: #fff0f4; border-color: var(--pink); box-shadow: 0 4px 0 var(--pink) }
.char b { font-size: 21px }
.char small { font-size: 14px; color: #c07a2c }
.char .trait { font-size: 15px; color: var(--pink) }
.char .note, .char .best { font-size: 13px; color: var(--soft); font-family: system-ui, sans-serif, var(--cjk, sans-serif); line-height: 1.4 }
.diff { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px }
.diff button { font: inherit; font-size: 17px; padding: 6px 16px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer }
.diff button.on { background: var(--pink); border-color: var(--pink); color: #fff }
.diff-note { display: grid; margin: 6px 0 0; text-align: center; font-size: 13px; color: var(--soft); font-family: system-ui, sans-serif, var(--cjk, sans-serif) }
.diff-note span { grid-area: 1 / 1; visibility: hidden } .diff-note span.on { visibility: visible }   /* 설명을 겹쳐 두어 높이가 그대로 — 아래 단추가 출렁이지 않게 */
.diff button.on[data-k=easy] { background: #6cc46a; border-color: #6cc46a } .diff button.on[data-k=normal] { background: #f2b53a; border-color: #f2b53a }
.diff button.on[data-k=hard] { background: #ef5a5a; border-color: #ef5a5a } .diff button.on[data-k=inf] { background: #9b6bff; border-color: #9b6bff }   /* 결과 화면 배지와 같은 색 */
@media (max-width: 440px) { .diff { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px } .diff button { display: flex; flex-direction: column; align-items: center; padding: 4px 0; border-radius: 16px; font-size: 15px } }   /* 좁은 폰 — 네 칸 한 줄(아이콘 위 · 글자 아래) */
@media (max-width: 520px) {
  .chars { grid-template-columns: 1fr }
  .char { display: grid; grid-template-columns: 76px 1fr; text-align: left; align-items: center; column-gap: 12px }
  .char canvas.pt { grid-row: span 5; justify-self: center }
}

/* 레벨 업 상자 */
.box .card:focus-visible { outline: 4px solid var(--pink); outline-offset: 3px }   /* 각성 상자 — Enter · Space 로 받을 카드 */
.box-title { margin: 0; font-size: 28px; color: #fff; text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 4px 0 var(--ink) }
.jack { margin: 4px 0 0; font-size: 34px; color: var(--gold); text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink); animation: shake .4s infinite alternate }
@keyframes shake { from { transform: rotate(-3deg) scale(1) } to { transform: rotate(3deg) scale(1.08) } }
.box.jackpot { background: linear-gradient(#fff3c4, var(--card) 60%) }
.cards { display: grid; gap: 10px; margin: 14px 0 10px }
.card { position: relative; display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 2px 12px; text-align: left; padding: 12px 14px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; box-shadow: 0 4px 0 var(--ink); animation: pop .25s ease-out backwards; animation-delay: calc(var(--i) * 60ms) }
.card.w { background: #fff6e6 }
.card.p { background: #eef5ff }
.card .ic { grid-row: span 3; font-size: 40px; text-align: center; line-height: 1 }
.card small { color: #b07a4f; font-size: 14px }
.card b { font-size: 20px }
.card .note { font-size: 14px; color: var(--soft); font-family: system-ui, sans-serif, var(--cjk, sans-serif); line-height: 1.4 }
.card .note .low { color: #e8475f; font-weight: bold }
.card.synergy { border-color: #e8a400; box-shadow: 0 4px 0 #e8a400, 0 0 0 4px rgba(255, 200, 60, .35) }
.card .syn { grid-column: 1 / -1; margin-top: 6px; padding: 5px 9px; border-radius: 10px; background: #fff0c4; font-size: 13px; line-height: 1.4 }
.card .syn mark { background: #e8a400; color: #fff; border-radius: 6px; padding: 0 6px }
.card kbd { position: absolute; top: 6px; right: 10px }
.box:not(.ready) .card { pointer-events: none }
.box.banning .card { border-color: #ff5b5b; box-shadow: 0 4px 0 #ff5b5b }
.box.banning .card.keep { opacity: .45; border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); cursor: not-allowed }   /* 가진 스킬은 제외 못 한다 */
.box.awaken { background: linear-gradient(#ffe3f4, var(--card) 60%) }
.card.a { background: #fff3fb; border-color: #e85bb5; box-shadow: 0 4px 0 #e85bb5 }
.box.jackpot .card { cursor: default }
.hint { margin: 4px 0 0; color: var(--soft); font-size: 15px }
.btn.act { font-size: 16px; padding: 8px 14px }
.btn.act em { font-style: normal; background: var(--ink); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: 13px }
.btn.act.on { background: #ffd9d9 }
@media (min-width: 760px) {
  .panel.box { width: min(860px, 100%) }
  .cards { grid-auto-flow: column; grid-auto-columns: minmax(0, 260px); justify-content: center }   /* 세 장이든 갈림길 두 장이든 가운데 */
  .card { grid-template-columns: 1fr; text-align: center; align-content: start; padding-top: 16px }
  .card .ic { grid-row: auto; font-size: 48px }
}

/* 일시정지 · 결과 */
.build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 }
.chip { padding: 4px 10px; border-radius: 999px; background: #eef5ff; border: 2px solid var(--ink); font-size: 14px }
.chip.w { background: #fff1d6 }
button.chip { font: inherit; color: inherit; cursor: pointer }
button.chip:hover, button.chip.on { box-shadow: 0 0 0 3px var(--pink) }
.skill-detail { text-align: left; background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; font: 14px/1.45 system-ui, sans-serif; color: var(--ink) }
.skill-detail p { margin: 4px 0 }
.skill-detail .t { font: 18px Jua, sans-serif }
.skill-detail .t small { color: var(--soft); font-size: 14px }
.skill-detail .hint { color: var(--soft); text-align: center }
.skill-detail .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 4px 8px; margin: 6px 0 }
.skill-detail .kv div { background: #fdf6e8; border-radius: 8px; padding: 3px 8px }
.skill-detail .kv.wide { grid-template-columns: 1fr }
.dmg { margin: 10px auto; max-width: 460px; text-align: left }
.dmg .dt { margin: 0 0 4px; font-size: 14px; color: var(--soft); text-align: center }
.dmg ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1.4em minmax(0, 8em) 1fr auto; align-items: center; gap: 4px 6px; font-size: 14px }
.dmg li { display: contents }
.dmg span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.dmg i { height: 10px; border-radius: 5px; background: linear-gradient(var(--pink), var(--pink)) left / var(--w) 100% no-repeat, #f1e6d6 }
.dmg b { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap }
.skill-detail .kv small { display: block; color: var(--soft); font-size: 11px }
.skill-detail .next { color: #2f7a3a }
.skill-detail .syn { color: var(--soft) } .skill-detail .syn.on { color: #c77800; font-weight: 600 }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 }
.stats div { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 4px }
.stats small { display: block; color: var(--soft); font-size: 13px }
.stats b { font-size: 20px }
.stats .new { color: #ff5b7f; font-size: 12px; margin-left: 2px }
.buff { list-style: none; margin: 10px 0 10px -20px; padding: 10px 14px; border: 2px solid #e5d6c8; border-radius: 14px; background: #fff }   /* 패치노트 — 시너지 수치 전 → 후 */
.guide .scroll .buff .t { color: var(--ink); font-size: 15px; margin: 0 0 2px }
.buff mark { margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #3fae5a; color: #fff; font-size: 12px; vertical-align: 1px }
.buff .sk { margin-top: 8px }
.buff .sk > b { font-size: 14px; color: var(--ink) }
.buff .cmp { display: grid; grid-template-columns: auto auto auto 1fr; gap: 2px 10px; align-items: baseline; margin: 2px 0 0 6px; font-size: 14px }
.buff .cmp s { color: #a8988c }
.buff .cmp s.same { text-decoration: none }
.buff .cmp i { font-style: normal; color: #a8988c }
.buff .cmp em { font-style: normal; font-weight: bold; color: #2e9e4f }
.buff .cmp em.new::after { content: 'NEW'; margin-left: 5px; font-size: 10px; color: #ff5b7f; vertical-align: 2px }
.buff .cmp em.same { font-weight: normal; color: #a8988c }
.btn mark.new { margin-left: 6px; padding: 1px 6px; border-radius: 999px; background: #ff5b7f; color: #fff; font-size: 11px; vertical-align: 2px }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr) } }
.result.win { background: linear-gradient(#fff3c4, var(--card) 50%) }
.lvl-badge { display: inline-block; margin: 4px 0 12px; padding: 6px 22px; border: 3px solid var(--ink); border-radius: 999px; font-size: 24px; color: #fff; box-shadow: 0 4px 0 var(--ink) }   /* 결과 — 난이도를 크게 */
.lvl-badge.easy { background: #6cc46a }
.lvl-badge.normal { background: #f2b53a }
.lvl-badge.hard { background: #ef5a5a }
.lvl-badge.inf { background: #9b6bff }


.guide .scroll .kid p { margin: 3px 0 0; font-family: inherit; font-size: 17px; line-height: 1.45; color: var(--ink) }
/* 도감 — 초등학생도 읽기 쉽게: 둥근 글씨 · 진한 색 · 줄마다 그림. 짝꿍은 초록, 각성은 분홍 */
.dex-nav { flex: none; display: flex; gap: 6px; overflow-x: auto; margin: 0 0 8px; padding: 2px 2px 6px; scrollbar-width: thin }
.dex-nav button { flex: none; font: inherit; font-size: 14px; padding: 4px 12px 4px 6px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap }
.dex-nav button:hover { background: #ffe3ea }
.dex-nav .ico, .dex .scroll h3.sec .ico { vertical-align: -0.35em }
.dex .scroll h3.sec { font-size: 20px; color: var(--ink); scroll-margin-top: 4px }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 7px 12px; background: #fff; border: 2px solid #eadccd; border-radius: 14px }
.steps > li > .ico { width: 36px; height: 36px; vertical-align: 0 }
.dex .scroll .steps p, .dex .scroll p.lead, .dex .scroll p.legend { margin: 0; font-family: inherit; font-size: 16px; line-height: 1.45; color: var(--ink) }
.dex .steps small { display: block; margin-top: 2px; font-size: 13.5px; color: var(--soft) }
.dex .steps .df { display: block }
.dex .scroll p.lead { margin: 0 0 8px; font-size: 15px }
.dex .scroll p.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 8px; font-size: 14px }
.dex .list b { font-size: 17px }
.dex .list span, .dex .list em { font-family: inherit; font-size: 14.5px; line-height: 1.45; color: var(--ink) }
.dex .list em { color: #b8691f }
.tag { display: block; margin-top: 6px; padding: 4px 10px; border-radius: 12px; font-size: 14.5px; line-height: 1.4; color: var(--ink) }
.legend .tag { display: inline-block; margin: 0; padding: 2px 4px }
.tag i { display: inline-block; margin-right: 6px; padding: 1px 10px 1px 4px; border-radius: 999px; color: #fff; font-style: normal; font-size: 13px }
.tag .ico { width: 22px; height: 22px; vertical-align: -6px }
.tag small { color: var(--soft); font-size: 13px }
.tag.mate { background: #e8f7ea; border: 2px solid #a7dcb1 }
mark.proj { display: inline-block; padding: 0 7px; background: #fff; border: 1.5px solid #8fb8e8; border-radius: 999px; color: #2f5f96; font: inherit; font-size: 11px; line-height: 1.5; white-space: nowrap; vertical-align: 2px }   /* 투사체 스킬 — 「둘이서 같이」 +1(도감 이름 옆 · 레벨업 카드 갈래 줄 끝 · 디자인) */
.dex mark.proj { margin-left: 6px }
mark.proj.lead { margin-right: 4px }   /* 레벨업 카드 — 갈래 줄 맨 앞(카드마다 같은 자리 · 디자인) */
.tag.mate i { background: #3fae5a }
.tag.aw { background: #fff0f7; border: 2px solid #ffbfdc }
.tag.aw i { background: #ff5ba7 }
.list li.pair { grid-template-columns: 96px 1fr; background: #f5fcf6; border-color: #bfe6c6 }
.pair .duo { display: flex; align-items: center; justify-content: center; gap: 2px }
.pair .duo .ico { width: 34px; height: 34px; vertical-align: 0 }
.pair .duo i { font-style: normal; font-size: 20px; color: #3fae5a }
.list li.awk { background: #fff7fb; border-color: #ffc9e3 }
/* 결과 — 토벌 보상금 · 떠돌이 보물상자 · 합계를 줄마다 */
.coin.pay { max-width: 440px; margin: 8px auto; padding: 6px 12px; background: #fffaf0; border: 2px solid #f0dcb0; border-radius: 14px; text-align: left }
.pay p { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; margin: 4px 0; font-size: 17px }
.pay p .ico { width: 28px; height: 28px; vertical-align: 0 }
.pay p b { font-weight: normal; font-size: 19px; color: #c07a2c; white-space: nowrap }
.pay p.sum { grid-template-columns: 1fr auto; padding: 6px 0 0 38px; border-top: 2px dashed #f0dcb0 }
.pay p.sum b { font-size: 22px; color: #e8475f }
/* 의상 — 캐릭터 고르기 · 미리 보기(걷기 · 이펙트) · 의상 줄(저가 · 고가 · 업적) · 한꺼번에 입기 */
.wr-mode { flex: none; display: flex; gap: 4px; margin: 0 0 8px }
.wr-mode button { flex: 1 1 0; min-width: 0; font: inherit; font-size: 13px; letter-spacing: -0.3px; padding: 7px 1px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap }
.wr-mode .ico { width: 1.15em; height: 1.15em }
.wr-mode button.on { background: var(--pink); color: #fff }
.list.wr mark.sk { background: #8fa9c9 }
.list.wr .sw { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg, var(--a), var(--b)); border: 2px solid #eadccd }
.list.wr .sw .ico { width: 36px; height: 36px; vertical-align: 0 }
.wr-tabs[hidden], .wr-view[hidden] { display: none }
.wr-tabs { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px }
.wr-tabs button { flex: none; width: 58px; height: 58px; padding: 2px; border: 3px solid #eadccd; border-radius: 16px; background: #fff; cursor: pointer }
.wr-tabs button.on { border-color: var(--pink); background: #fff0f5 }
.wr-tabs canvas.pt { width: 100%; height: 100%; object-fit: contain }
.wr-view { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 6px; padding: 6px; background: #f4fbe9; border: 2px solid #d6ecbf; border-radius: 18px }
.wr-view canvas.wr-pv { width: 190px; height: 176px }
.wardrobe .scroll .wr-view { position: sticky; top: 0; z-index: 2; box-shadow: 0 4px 0 rgba(74,59,53,.08) }   /* 입어 볼 때 미리 보기가 늘 보이게(목록만 아래로 흐른다) */
.wr-view.sk { flex-direction: column; gap: 0; text-align: center }   /* 스킬 스킨 — 원래 · 스킨 나란히, 글은 아래 */
.wr-view:not(.sk):not([hidden]) { display: grid; grid-template-columns: 46% 1fr; justify-content: stretch }   /* 의상 · 무기 스킨 — 캐릭터 칸 · 설명 칸 비율을 고정(이름 길이에 따라 캐릭터가 움직이지 않게) */
.wr-view:not(.sk) canvas.wr-pv { justify-self: center }
.wr-view:not(.sk) > p { justify-self: start; min-width: 0; margin: 0; overflow-wrap: anywhere }
.wr-view canvas.wr-pv.sk-pv { width: 280px; height: 121px }
.wr-view b { display: block; font-size: 22px; font-weight: normal; color: var(--ink) }
.wr-view small { display: block; font-size: 15px; color: var(--soft) }
.guide .scroll p.wr-msg:empty { display: none }
.guide .scroll p.wr-msg { min-height: 1.4em; margin: 0 0 6px; text-align: center; font-family: inherit; font-size: 16px; color: #e8475f }
.list.wr li { grid-template-columns: 56px 1fr auto }
@media (max-width: 520px) {   /* 휴대폰 · 작은 태블릿(영어 잠금 글은 520 까지 넘친다) — 세 칸이면 가운데 이름 칸이 70~100px(일본어 「雪の結晶の新人討伐隊マント」가 4자씩 끊기고 잠금 글 「冬 かんたん以上でクリア」가 넘친다) → 단추를 글 밑으로 */
  .list.wr li:not(.wr-bonus) { grid-template-columns: 56px minmax(0, 1fr); gap: 6px 10px }
  .list.wr li > :first-child { grid-row: 1 / 3 }
  .list.wr li > .btn, .list.wr li > .acts { grid-column: 2; justify-self: end; flex-direction: row }
  .list.wr .btn.buy { white-space: normal; text-wrap: balance }
  :lang(ja) .list.wr b { word-break: auto-phrase; overflow-wrap: break-word }   /* 옷장 이름도 문절에서(「雪の結晶の / 討伐隊マント」) — 세 칸(521~)에선 이름 칸 최소 폭이 커져 잠금 단추가 밀려서 여기만 */
  .list.wr mark { display: inline-block; max-width: calc(100% - 6px); white-space: normal; text-wrap: balance; line-height: 1.3; border-radius: 12px; vertical-align: 1px }   /* 이름표 — 한 덩어리로 두고 안에서 두 줄(영어 「It'll Work Out / Somehow!」 — 디자인) */
}
:lang(ja) .ach-new.dress span { word-break: auto-phrase; overflow-wrap: break-word }   /* 일본어 — 문절에서 끊기(「島の / 花かんむり」, Chrome · Edge. Safari · Firefox 는 예전처럼) — 디자인 */
.list.wr .acts { display: flex; flex-direction: column; gap: 6px }
.list.wr li.wr-bonus { display: block; cursor: default; background: #fffaf0; border-color: #f0dcb0 }   /* 의상 보유 효과 — 눌러서 펼친다 */
.wr-bonus summary { cursor: pointer; font-size: 16px; color: var(--ink); list-style: none }
.wr-bonus summary::-webkit-details-marker { display: none }
.wr-bonus summary::after { content: ' \25BE'; color: var(--soft) }
.wr-bonus details[open] summary::after { content: ' \25B4' }
.wr-bonus .sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px 14px; margin: 10px 0 8px; font-size: 14px }
.wr-bonus .sum div { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 3px 6px; color: #a89488 }
.wr-bonus .sum div.on { color: var(--ink) } .wr-bonus .sum div.on b { color: #c07a2c }
.wr-bonus .sum small { font-weight: normal; color: #a89488 }
